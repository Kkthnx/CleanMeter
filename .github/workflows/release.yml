# Builds the desktop app and publishes it as a GitHub Release when a version
# tag is pushed. Publishes two assets: cleanmeter.windows.zip, whose name and
# layout match what AutoUpdater.kt and the Updater project expect so in-app
# auto-update keeps working, and a real Windows installer (.msi) for anyone
# installing CleanMeter for the first time.
#
# The installer is built from our own WiX project (target/desktop/wix),
# not jpackage's bundler. jpackage's own installer UI (<UIRef Id="JpUI"/>
# in its main.wxs) is compiled into jpackage itself, not overridable
# through its resource-dir mechanism, and its light.exe/candle.exe
# invocation does not link WixUIExtension, so there is no safe way to add
# custom banner/dialog art through jpackage directly. See
# target/desktop/wix/main.wxs for the full explanation.

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.200'

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build distributable
        run: ./gradlew :target:desktop:createDistributable

      - name: Package release zip
        working-directory: target/desktop/build/compose/binaries/main/app
        run: Compress-Archive -Path cleanmeter -DestinationPath cleanmeter.windows.zip

      - name: Setup WiX
        working-directory: target/desktop/wix
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5.0.2

      - name: Build installer
        working-directory: target/desktop/wix
        run: |
          wix build main.wxs `
            -ext WixToolset.UI.wixext `
            -arch x64 `
            -d CmVersion="${{ github.ref_name }}.0" `
            -d CmResourcesDir="${{ github.workspace }}\target\desktop\installer-resources\windows" `
            -d CmAppImageDir="${{ github.workspace }}\target\desktop\build\compose\binaries\main\app\cleanmeter" `
            -o "${{ github.workspace }}\cleanmeter-${{ github.ref_name }}.msi"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "target/desktop/build/compose/binaries/main/app/cleanmeter.windows.zip" `
            "cleanmeter-${{ github.ref_name }}.msi#CleanMeter-${{ github.ref_name }}-installer.msi" `
            --title "${{ github.ref_name }}" `
            --generate-notes
